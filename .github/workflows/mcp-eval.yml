name: mcp-eval

# MCP contract suite (eval/mcp.suite.yaml) via the mcp-eval-harness composite action.
# The harness is pinned to the v1 PR head; repin to the merged main SHA after
# mcp-eval-harness PRs #5 and #6 merge (here and in package.json together).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: SarutobiSasuke8/mcp-eval-harness@077c74a60ccd6d9061e35f882ffd3db5f5d17052
        with:
          suite: eval/mcp.suite.yaml
          node-version: ""
